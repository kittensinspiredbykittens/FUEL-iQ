{% extends "base.html" %}
{% block title %}Choose a new password — FuelIQ{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-box">
    <div class="auth-logo">Fuel<em>IQ</em></div>
    <p class="auth-sub">Choose a new password for your account.</p>
    <form method="POST">
      <div class="form-group">
        <label for="password">New password</label>
        <input id="password" type="password" name="password" required minlength="8" autocomplete="new-password" autofocus>
      </div>
      <div class="form-group">
        <label for="confirm_password">Confirm new password</label>
        <input id="confirm_password" type="password" name="confirm_password" required minlength="8" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-green btn-full">Reset password</button>
    </form>
    <p class="auth-footer"><a href="{{ url_for('login') }}">Back to sign in</a></p>
  </div>
</div>
{% endblock %}
